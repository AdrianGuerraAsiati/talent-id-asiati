services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: talent_id
      POSTGRES_USER: talent_id
      POSTGRES_PASSWORD: talent_id_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent_id -d talent_id"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - talent_id_postgres:/var/lib/postgresql/data

volumes:
  talent_id_postgres:
